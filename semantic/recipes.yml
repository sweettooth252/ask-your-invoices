# ---------------------------------------------------------------------------
# The menu, written the way a bar writes its specs.
#
# An ingredient is not a product. "Oat milk" is bought from two suppliers, so
# its price in any period is the volume-weighted price across both - what the
# venue actually paid. That is how invoices become cost per drink.
#
# yield: for fruit bought by the kilo but used by the millilitre. A kilo of
# Tahitian limes gives roughly 450ml of juice once you have squeezed it, which
# is the number that turns a lime price into a margarita cost.
# ---------------------------------------------------------------------------

ingredients:
  vodka:            {products: [HS-VOD-07]}
  gin:              {products: [HS-GIN-07]}
  tequila:          {products: [HS-TEQ-75]}
  coffee_liqueur:   {products: [HS-CFL-07]}
  bitter_aperitivo: {products: [HS-BIT-07]}
  sweet_vermouth:   {products: [HS-VER-10]}
  spritz_aperitivo: {products: [HS-SPZ-07]}
  prosecco:         {products: [HS-PRO-75]}
  triple_sec:       {products: [HS-TSC-07]}
  espresso_beans:   {products: [EC-HB-1K]}
  filter_beans:     {products: [EC-SO-1K]}
  cold_brew:        {products: [EC-CB-5L]}
  full_cream_milk:  {products: [D-101]}
  oat_milk:         {products: [D-140, BS-OAT-1L]}
  sugar_syrup:      {products: [BS-SYR-1L]}
  tonic:            {products: [BS-TON-20]}
  soda:             {products: [BS-SOD-20]}
  lime_juice:       {products: ["1460"], yield: 0.45}   # litres of juice per kg
  lemon_juice:      {products: ["1455"], yield: 0.40}
  orange_garnish:   {products: ["1470"]}                 # a wheel or twist, by weight
  cup_8oz:          {products: [BS-CUP-08]}
  lid_8oz:          {products: [BS-LID-08]}

# price is the menu price including GST, as printed on the menu
drinks:
  Espresso Martini:
    type: Cocktail
    price: 24.00
    spec: {vodka: 30ml, coffee_liqueur: 30ml, espresso_beans: 18g, sugar_syrup: 7.5ml}
  Margarita:
    type: Cocktail
    price: 23.00
    spec: {tequila: 45ml, triple_sec: 15ml, lime_juice: 30ml, sugar_syrup: 7.5ml}
  Negroni:
    type: Cocktail
    price: 22.00
    spec: {gin: 30ml, bitter_aperitivo: 30ml, sweet_vermouth: 30ml, orange_garnish: 20g}
  Spritz:
    type: Cocktail
    price: 19.00
    spec: {spritz_aperitivo: 60ml, prosecco: 90ml, soda: 30ml, orange_garnish: 20g}
  Gin & Tonic:
    type: Cocktail
    price: 16.00
    spec: {gin: 30ml, tonic: 150ml, lime_juice: 5ml}
  Flat White:
    type: Coffee
    price: 5.50
    spec: {espresso_beans: 18g, full_cream_milk: 180ml}
  Oat Latte (takeaway):
    type: Coffee
    price: 6.50
    spec: {espresso_beans: 18g, oat_milk: 220ml, cup_8oz: 1ea, lid_8oz: 1ea}
  Batch Filter:
    type: Coffee
    price: 5.00
    # Brewed in a batch: 150g of filter beans makes a 2.5L brew, which pours ten
    # cups. Write the spec the way the bar actually makes it, and let the code
    # divide. Cost per serve is the batch cost / 10.
    batch: {makes: 10}
    spec: {filter_beans: 150g}
  Cold Brew on Ice:
    type: Coffee
    price: 6.00
    spec: {cold_brew: 90ml}
