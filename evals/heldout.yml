# Questions written by people who had never seen the app.
# This is the honest score; questions.yml is the optimistic one.

answer:
  - q: How much are we spending on milk every month?
    intent: query
    metrics: [spend]
    dimensions: [month]
    filters: {category: Milk & alternatives}
  - q: How much did we spend on coffee each quarter?
    intent: query
    metrics: [spend]
    dimensions: [quarter]
    filters: {category: Coffee}
  - q: Is Northside cheaper than Bar & Barista for oat milk?
    intent: query
    metrics: [avg_price_per_unit]
    dimensions: [supplier]
    filters: {product: Oat Milk Barista}
  - q: What did we spend the most money on last year?
    intent: query
    metrics: [spend]
    dimensions: [product]
  - q: What products do we buy from multiple suppliers, and which supplier usually gives us the cheaper price?
    intent: query
    metrics: [avg_price_per_unit]
    dimensions: [supplier, product]
    filters: {product: Oat Milk Barista}

refuse:
  - q: Which barista wastes the most milk?
  - q: How fast does each supplier deliver?
  - q: Which supplier has the best customer feedback?
  - q: Can you check if the goods on an invoice were actually delivered?
  - q: If an item on an invoice was not delivered, can you track it?
  - q: Which products look like the same thing but have different names on different invoices?
  - q: Show me the invoice for arabica coffee beans across all suppliers and if one is a better option to select for cashflow based of delivery time and costs and amount of cups and customer feedback

guard:
  - q: What is the total quantity we bought by category?
