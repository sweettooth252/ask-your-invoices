# Held-out questions: ask 3-5 people who have NOT seen this repo to write
# questions they'd ask a cafe-bar's invoices. Write the correct plan for each
# yourself, in the same format as questions.yml, then run:
#
#     python -m evals.run_evals --suite heldout
#
# This is the number to put in the README. The seed set is optimistic because
# the same person wrote the questions and the planner rules.
answer:
  - q: How much are we spending on milk every month?
    intent: query
    metrics: [spend]
    dimensions: [month]
    filters: {category: Milk & alternatives}
  - q: How much did we spend on coffee each quarter?
    intent: query
    metrics: [spend]
    dimensions: [quarter]
    filters: {category: Coffee}
  - q: Is Northside cheaper than Bar & Barista for oat milk?
    intent: query
    metrics: [avg_price_per_unit]
    dimensions: [supplier]
    filters: {product: Oat Milk Barista}
refuse:
  - q: Which barista wastes the most milk?
guard:
  - q: What is the total quantity we bought by category?
